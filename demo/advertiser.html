/* =========================================================
   COST ENGINE
   Cost scales with: number of selected screens, nights,
   dayparts selected, and an intensity multiplier.
========================================================= */
function computeCost(screenIds, start, end, parts, intensity){
  const nights = Math.max(1, end - start + 1);
  const partsCount = Math.max(1, parts.length);
  const chosen = screenIds.map(id => SCREEN_BY_ID[id]).filter(Boolean);
  const dailyBase = chosen.reduce((sum, s) => sum + s.rate, 0);
  const dailyCost = dailyBase * (partsCount / 6) * intensity;
  const subtotal = dailyCost * nights;
  const fee = Math.round(subtotal * 0.05);
  const total = Math.round(subtotal) + fee;
  const loopsPerDay = chosen.length ? Math.round((dailyCost / (90 * chosen.length)) * chosen.length) : 0;
  const totalLoops = loopsPerDay * nights;
  const reach = Math.round(totalLoops * 62 * Math.max(1, chosen.length * 0.6));
  return { nights, partsCount, dailyBase, dailyCost, subtotal: Math.round(subtotal), fee, total, loopsPerDay, totalLoops, reach, screenCount: chosen.length };
}

/* =========================================================
   PANNABLE / SCROLLABLE MAP
========================================================= */
const CANVAS_W = 2200, CANVAS_H = 1300;

function ScreenMap({ lang, t, selected, onToggle, mini }){
  const scrollRef = useRef(null);
  const dragging = useRef(false);
  const last = useRef({x:0,y:0});

  useEffect(() => {
    // center the scroll roughly on Cotonou at mount
    const el = scrollRef.current;
    if(el){ el.scrollLeft = 780; el.scrollTop = 320; }
  }, []);

  function onDown(e){
    dragging.current = true;
    const p = e.touches ? e.touches[0] : e;
    last.current = { x:p.clientX, y:p.clientY };
  }
  function onMove(e){
    if(!dragging.current) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - last.current.x, dy = p.clientY - last.current.y;
    last.current = { x:p.clientX, y:p.clientY };
    const el = scrollRef.current;
    if(el){ el.scrollLeft -= dx; el.scrollTop -= dy; }
  }
  function onUp(){ dragging.current = false; }

  const fr = lang === 'fr';

  return (
    <div style={{ position:'relative' }}>
      <div
        ref={scrollRef}
        className="mapScroll"
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
        style={{
          position:'relative', overflow:'auto', borderRadius:13, border:'1px solid '+P.line,
          background:'#E9EEF4', height: mini ? 'clamp(230px,32vh,300px)' : 'clamp(320px,48vh,480px)',
          cursor: dragging.current ? 'grabbing' : 'grab', userSelect:'none', WebkitOverflowScrolling:'touch'
        }}
      >
        <div style={{ position:'relative', width:CANVAS_W, height:CANVAS_H }}>
          <div style={{ position:'absolute', inset:0,
            backgroundImage:'linear-gradient(rgba(15,24,38,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,24,38,.05) 1px,transparent 1px)',
            backgroundSize:'52px 52px' }}/>
          {/* stylised lagoon + coast */}
          <div style={{ position:'absolute', left:0, top:'62%', width:'100%', height:'20%', background:'#D8E6F8' }}/>
          <div style={{ position:'absolute', left:'-4%', top:'20%', width:'70%', height:60, background:'#fff', transform:'rotate(-6deg)' }}/>
          <div style={{ position:'absolute', left:'55%', top:'8%', width:60, height:'90%', background:'#fff', transform:'rotate(5deg)' }}/>
          <div style={{ position:'absolute', left:'70%', top:'30%', width:'34%', height:44, background:'#fff', transform:'rotate(-3deg)' }}/>
          <div style={{ position:'absolute', left:24, top:24, display:'flex', alignItems:'center', gap:7, padding:'8px 13px', borderRadius:99, background:'#fff', border:'1px solid '+P.line, font:"700 12px/1 'Manrope'", color:P.body, boxShadow:'0 2px 10px rgba(15,24,38,.08)' }}>
            <Icon name="pin" size={14} color={P.blue}/> Cotonou & environs · {SCREENS.length}
          </div>
          <div style={{ position:'absolute', right:24, top:24, display:'flex', alignItems:'center', gap:7, padding:'8px 12px', borderRadius:99, background:'rgba(15,24,38,.72)', color:'#fff', font:"600 11px/1 'Manrope'" }}>
            <Icon name="move" size={13} color="#fff" sw={1.9}/> {t.dragHint}
          </div>

          {SCREENS.map(s => {
            const on = selected.includes(s.id);
            return (
              <div key={s.id} onClick={()=>onToggle(s.id)}
                style={{ position:'absolute', left:s.x, top:s.y, transform:'translate(-50%,-100%)', cursor:'pointer', zIndex: on?3:1 }}>
                {on && <div style={{ position:'absolute', left:'50%', top:'100%', width:16, height:16, marginLeft:-8, marginTop:-8, borderRadius:'50%', background:P.blue, animation:'ping 1.9s ease-out infinite' }}/>}
                <div style={{
                  padding: on ? '7px 11px' : '6px 9px', borderRadius:8, display:'flex', alignItems:'center', gap:6,
                  background: on ? P.blue : '#fff', border:'1px solid '+(on?P.blue:'#CBD4E0'),
                  boxShadow: on ? '0 4px 12px rgba(232,169,58,.34)' : '0 1px 3px rgba(15,24,38,.13)',
                  font:(on?'800 11.5px/1':'600 10.5px/1')+" 'Manrope'", color:on?P.ink:P.body, whiteSpace:'nowrap'
                }}>
                  {on && <Icon name="check" size={11} color={P.ink} sw={3}/>}
                  <span style={{ width:5, height:5, borderRadius:'50%', background:on?'#fff':P.green, display:on?'none':'inline-block' }}/>
                  {fr ? s.shortFr : s.short}
                </div>
                <div style={{ width:1, height:11, margin:'0 auto', background:on?P.blue:'#98A3B4' }}/>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

  }

    setStep(s => Math.min(3, s+1));
  }

    const campName = wName || (fr ? 'Campagne sans titre' : 'Untitled campaign');

      id:'x' + Date.now(), en:campName, fr:campName, name:campName,
      screens: wScreens.slice(), start:wStart, end:wEnd, parts:wParts.slice(), intensity:wIntensity,
      imp:0, spend:0, status:'sched'

    setCampaigns(prev => prev.concat(newCamp));
    setBalance(prev => Math.max(0, prev - cost.total));

                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, marginBottom:14, flexWrap:'wrap' }}>
                        <span style={{ font:"700 14px/1 'Manrope'" }}>{t.month}</span>
                        <span style={{ font:"700 12px/1 'Manrope'", color:P.blue }}>{dateLabel}</span>
                      </div>
                      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:5, marginBottom:6 }}>
                        {t.dow.map((d,i)=>(<span key={i} style={{ textAlign:'center', font:"700 10px/1 'Manrope'", color:P.dim }}>{d}</span>))}
                      </div>
                      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:5 }}>
                        {Array.from({length:30},(_,k)=>{
                          const d=k+1, inR=d>=wStart&&d<=wEnd, edge=d===wStart||d===wEnd;
                          return (
                            <div key={d} onClick={()=>{ d<=wStart ? setWStart(d) : setWEnd(d); }} style={{ aspectRatio:'1 / 1', minHeight:30, maxHeight:40, borderRadius:7, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', background:edge?P.blue:inR?P.blueSoft:'transparent', color:edge?P.ink:inR?P.blueDark:P.mute, font:(edge?'800':'600')+" 12.5px/1 'Manrope'" }}>{d}</div>
                          );
                        })}
                      </div>
                      <div style={{ marginTop:12, font:"500 11px/1.5 'Manrope'", color:P.dim }}>{t.calendarHint}</div>
                    </div>
                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:12, marginBottom:12, flexWrap:'wrap' }}>
                        <span style={{ font:"700 14px/1 'Manrope'" }}>{t.dayparting}</span>
                        <span style={{ font:"600 11.5px/1 'Manrope'", color:P.dim }}>{wParts.length} {t.selected}</span>
                      </div>
                      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,168px),1fr))', gap:9 }}>
                        {SLOTS.map((s,i)=>{
                          const on = wParts.includes(i);
                          return (
                            <div key={i} onClick={()=>setWParts(p=>p.includes(i)?p.filter(x=>x!==i):p.concat(i))} style={{ padding:'12px 13px', borderRadius:9, cursor:'pointer', display:'flex', alignItems:'flex-start', gap:10, background:on?P.blueSoft:'#fff', border:'1px solid '+(on?P.blue:P.line) }}>
                              <span style={{ width:16, height:16, marginTop:1, borderRadius:4, flex:'none', display:'flex', alignItems:'center', justifyContent:'center', background:on?P.blue:'#fff', border:'1px solid '+(on?P.blue:'#CBD4E0'), color:P.ink, font:"800 10px/1 'Manrope'" }}>{on?'✓':''}</span>
                              <div>
                                <div style={{ font:"700 12.5px/1.2 'Manrope'", color:on?P.blueDark:P.ink }}>{fr?s.fr:s.en}</div>
                                <div style={{ marginTop:5, font:"500 10.5px/1 'JetBrains Mono',monospace", color:P.dim }}>{s.t}</div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                  <div style={{ flex:'1 1 296px', minWidth:0, display:'flex', flexDirection:'column', gap:12, position:'sticky', top:78 }}>
                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10 }}>
                        <span style={{ font:"700 14px/1 'Manrope'" }}>{t.balancer}</span>
                        <span style={{ font:"800 14px/1 'Manrope'", color:P.blue }}>{wIntensity.toFixed(1)}×</span>
                      </div>
                      <div style={{ margin:'18px 0 4px' }}>
                        <input type="range" min="0.4" max="2" step="0.1" value={wIntensity} onChange={e=>setWIntensity(+e.target.value)}/>
                      </div>
                      <div style={{ display:'flex', justifyContent:'space-between', font:"500 10.5px/1 'JetBrains Mono',monospace", color:'#98A3B4' }}><span>0.4×</span><span>2.0×</span></div>
                      <div style={{ display:'flex', gap:9, marginTop:18, flexWrap:'wrap' }}>
                        {[[t.loopsPerDay,String(cost.loopsPerDay)],[t.airtime,String(Math.round(cost.loopsPerDay*0.25))],[t.reach,fmt(cost.reach)]].map((d,i)=>(
                          <div key={i} style={{ flex:'1 1 118px', padding:13, borderRadius:9, background:i===0?P.blueSoft:P.bg, border:'1px solid '+(i===0?P.blueLine:P.line) }}>
                            <div style={{ font:"800 21px/1 'Manrope'", letterSpacing:'-.02em' }}>{d[1]}</div>
                            <div style={{ marginTop:6, font:"700 9.5px/1.3 'Manrope'", letterSpacing:'.06em', textTransform:'uppercase', color:i===0?'#4A7CC4':P.dim }}>{d[0]}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ display:'flex', justifyContent:'space-between', gap:12, font:"500 12.5px/1.4 'Manrope'", color:P.mute, paddingBottom:11 }}>
                        <span>{cost.nights} {t.days} × {cost.partsCount} {t.slots} × {cost.screenCount} {t.screensLbl}</span><span style={{ color:P.ink, fontWeight:600 }}>{money(cost.subtotal)}</span>
                      </div>
                      <div style={{ display:'flex', justifyContent:'space-between', gap:12, font:"500 12.5px/1 'Manrope'", color:P.mute, paddingBottom:12, borderBottom:'1px solid '+P.line2 }}>
                        <span>{t.platformFee}</span><span style={{ color:P.ink, fontWeight:600 }}>{money(cost.fee)}</span>
                      </div>
                      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:12, paddingTop:12 }}>
                        <span style={{ font:"700 12.5px/1.3 'Manrope'", maxWidth:150 }}>{t.estCost}</span>
                        <span style={{ font:"800 clamp(20px,2.6vw,24px)/1 'Manrope'", letterSpacing:'-.03em' }}>{money(cost.total)}</span>
                      </div>
                    </div>
                    <button className="btn" onClick={()=>setStep(3)} style={{ width:'100%', padding:16, border:'none', borderRadius:9, background:P.blue, color:P.ink, font:"800 14px/1 'Manrope'" }}>{t.continue}</button>
                  </div>
                </div>
              </div>
            )}

            {/* step 3: creative & payment */}
            {step===3 && (
              <div style={{ animation:'riseIn .22s ease' }}>
                <div style={{ display:'flex', gap:12, flexWrap:'wrap', alignItems:'flex-start' }}>
                  <div style={{ flex:'1.3 1 340px', minWidth:0, ...card('clamp(16px,2.2vw,22px)') }}>
                    <div style={{ font:"700 14px/1 'Manrope'", marginBottom:14 }}>{t.creative}</div>
                    <div style={{ border:'2px dashed #F1D9A4', borderRadius:11, background:'#FDF8EE', padding:'clamp(24px,3.6vw,40px) clamp(16px,3vw,26px)', textAlign:'center' }}>
                      <div style={{ width:50, height:50, margin:'0 auto 14px', borderRadius:13, background:P.blueSoft, border:'1px solid '+P.blueLine, display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name="upload" size={22} color={P.blue} sw={2}/></div>
                      <div style={{ font:"700 clamp(13.5px,1.8vw,15px)/1.55 'Manrope'", maxWidth:360, margin:'0 auto' }}>{t.dropzone}</div>
                      <div style={{ marginTop:9, font:"500 11px/1 'JetBrains Mono',monospace", color:'#8794A6' }}>{t.dropzoneHint}</div>
                      <button className="btn" onClick={()=>flash(t.toastBrowse)} style={{ marginTop:16, padding:'11px 18px', borderRadius:8, background:'#fff', border:'1px solid '+P.line, font:"700 12.5px/1 'Manrope'", color:P.ink }}>{t.browse}</button>
                    </div>
                    <div style={{ marginTop:12, display:'flex', alignItems:'center', gap:12, padding:12, borderRadius:9, border:'1px solid '+P.line, background:'#FAFBFC' }}>
                      <div style={{ width:52, height:32, borderRadius:5, flex:'none', background:'repeating-linear-gradient(135deg,#E9EDF2 0 6px,#DFE5EC 6px 12px)' }}/>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ font:"700 12.5px/1.2 'Manrope'", overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{(wName||'campaign').toLowerCase().replace(/\s+/g,'-')}-16x9.mp4</div>
                        <div style={{ marginTop:4, font:"500 10.5px/1 'JetBrains Mono',monospace", color:P.dim }}>12.4 MB · 15 s · 1920×1080</div>
                      </div>
                      <span style={{ padding:'4px 8px', borderRadius:5, background:P.greenSoft, font:"700 10.5px/1 'Manrope'", color:P.green }}>{t.approved}</span>
                    </div>
                    <div style={{ marginTop:16, font:"700 12px/1 'Manrope'", color:P.body }}>{t.campaignName}</div>
                    <input value={wName} onChange={e=>setWName(e.target.value)} placeholder={t.campaignNamePlaceholder} style={{ width:'100%', marginTop:8, padding:'13px 14px', borderRadius:9, border:'1px solid '+P.line, outline:'none', font:"600 13px/1 'Manrope'", color:P.ink }}/>
                  </div>
                  <div style={{ flex:'1 1 296px', minWidth:0, display:'flex', flexDirection:'column', gap:12 }}>
                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ font:"700 14px/1 'Manrope'", marginBottom:13 }}>{t.paymentNetwork}</div>
                      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,104px),1fr))', gap:9 }}>
                        {NETS.map((p,i)=>{
                          const on = i===wPay;
                          return (
                            <div key={i} onClick={()=>setWPay(i)} style={{ padding:'14px 8px', borderRadius:9, textAlign:'center', cursor:'pointer', position:'relative', background:on?P.blueSoft:'#fff', border:'1px solid '+(on?P.blue:P.line) }}>
                              {on && <div style={{ position:'absolute', top:6, right:6, width:13, height:13, borderRadius:'50%', background:P.blue, color:P.ink, font:"800 8.5px/13px 'Manrope'" }}>✓</div>}
                              <div style={{ width:30, height:30, margin:'0 auto 8px', borderRadius:8, background:p.c, color:'#fff', font:"800 10.5px/30px 'Manrope'" }}>{p.i}</div>
                              <div style={{ font:"700 10.5px/1.25 'Manrope'", color:on?P.blueDark:P.mute }}>{p.n}</div>
                            </div>
                          );
                        })}
                      </div>
                      <div style={{ marginTop:16, font:"700 12px/1 'Manrope'", color:P.body }}>{t.momoNumber}</div>
                      <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:10, padding:'0 14px', borderRadius:9, background:'#fff', border:'1px solid '+(phoneFocus?P.blue:P.line), boxShadow:phoneFocus?'0 0 0 3px rgba(232,169,58,.15)':'none' }}>
                        <span style={{ font:"600 13.5px/1 'JetBrains Mono',monospace", color:P.mute }}>+229</span>
                        <span style={{ width:1, height:20, background:'#E4E8ED' }}/>
                        <input type="tel" value={wPhone} onChange={e=>setWPhone(e.target.value)} onFocus={()=>setPhoneFocus(true)} onBlur={()=>setPhoneFocus(false)} placeholder={t.momoPlaceholder} style={{ flex:1, minWidth:0, background:'transparent', border:'none', outline:'none', padding:'14px 0', font:"600 13.5px/1 'Manrope'", color:P.ink }}/>
                      </div>
                      <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:10 }}><Icon name="lock" size={13} color={P.green} sw={2.1}/><span style={{ font:"500 11px/1.4 'Manrope'", color:P.mute }}>{t.ussdNote}</span></div>
                    </div>
                    <div style={card('clamp(16px,2.2vw,22px)')}>
                      <div style={{ font:"700 14px/1 'Manrope'", marginBottom:13 }}>{t.review}</div>
                      <div style={{ display:'flex', flexDirection:'column', gap:9, paddingBottom:12 }}>
                        {[[t.rev[0], screenNames(wScreens)],[t.rev[1], dateLabel],[t.rev[2], String(cost.loopsPerDay)],[t.rev[3], (wName||'campaign').toLowerCase().replace(/\s+/g,'-')+'-16x9.mp4']].map((r,i)=>(
                          <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:14, font:"500 12.5px/1.4 'Manrope'", color:P.mute }}>
                            <span>{r[0]}</span><span style={{ color:P.ink, fontWeight:700, textAlign:'right', minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{r[1]}</span>
                          </div>
                        ))}
                      </div>
                      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:12, paddingTop:12, borderTop:'1px solid '+P.line2 }}>
                        <span style={{ font:"700 12.5px/1 'Manrope'" }}>{t.totalDue}</span><span style={{ font:"800 clamp(19px,2.4vw,22px)/1 'Manrope'", letterSpacing:'-.02em', color:P.blue }}>{money(cost.total)}</span>
                      </div>
                      {editingId ? (
                        <button className="btn" onClick={saveEdit} style={{ width:'100%', marginTop:16, padding:17, border:'none', borderRadius:9, background:P.blue, color:P.ink, font:"800 clamp(14px,1.9vw,15.5px)/1 'Manrope'" }}>{t.saveChanges}</button>
                      ) : (
                        <button className="btn" onClick={authorize} style={{ width:'100%', marginTop:16, padding:17, border:'none', borderRadius:9, background:P.blue, color:P.ink, font:"800 clamp(14px,1.9vw,15.5px)/1 'Manrope'" }}>{t.authorize}</button>
                      )}
                      <div style={{ marginTop:10, textAlign:'center', font:"500 10.5px/1 'JetBrains Mono',monospace", color:'#98A3B4' }}>{NETS[wPay].n} · sparAds SA</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* step 4: done */}
            {step===4 && (
              <div style={{ maxWidth:560, margin:'clamp(6px,2vh,26px) auto 0', background:'#fff', border:'1px solid '+P.line, borderRadius:14, padding:'clamp(22px,3.4vw,34px)' }}>
                <div style={{ width:56, height:56, borderRadius:16, background:P.greenSoft, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:20 }}><Icon name="check" size={26} color={P.green} sw={2.6}/></div>
                <h1 style={{ margin:0, font:"800 clamp(21px,3.2vw,28px)/1.2 'Manrope'", letterSpacing:'-.03em' }}>{t.doneTitle}</h1>
                <p style={{ margin:'11px 0 20px', font:"500 clamp(13px,1.6vw,14.5px)/1.6 'Manrope'", color:P.mute }}>{t.doneA} {money(cost.total)} {t.doneB} {NETS[wPay].n}. {t.doneC}</p>
                <div style={{ border:'1px solid '+P.line2, borderRadius:11, overflow:'hidden' }}>
                  {[[t.rev[0], screenNames(wScreens)],[t.rev[1], dateLabel],[t.rev[2], String(cost.loopsPerDay)],[t.rev[3], (wName||'campaign').toLowerCase().replace(/\s+/g,'-')+'-16x9.mp4']].map((r,i)=>(
                    <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:14, padding:'13px 16px', font:"500 12.5px/1.4 'Manrope'", color:P.mute, borderTop:i?'1px solid '+P.line2:'none', background:i%2?'#FAFBFC':'#fff' }}>
                      <span>{r[0]}</span><span style={{ color:P.ink, fontWeight:700, textAlign:'right' }}>{r[1]}</span>
                    </div>
                  ))}
                </div>
                <div style={{ marginTop:14, display:'flex', alignItems:'center', gap:9, padding:'13px 15px', borderRadius:9, background:P.blueSoft, border:'1px solid '+P.blueLine }}>
                  <span style={{ width:6, height:6, borderRadius:'50%', background:P.blue, flex:'none' }}/>
                  <span style={{ font:"600 11.5px/1.4 'Manrope'", color:P.blueDark }}>{t.smsReceipt} · SPR-{Math.floor(1000+Math.random()*9000)}</span>
                </div>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap', marginTop:20 }}>
                  <button className="btn" onClick={()=>{setWizardOpen(false); go('campaigns');}} style={{ flex:'1 1 200px', padding:16, border:'none', borderRadius:9, background:P.blue, color:P.ink, font:"800 13.5px/1 'Manrope'" }}>{t.seeCampaigns}</button>
                  <button className="btn" onClick={openNewWizard} style={{ flex:'1 1 160px', padding:16, border:'1px solid '+P.line, borderRadius:9, background:'#fff', color:P.ink, font:"700 13px/1 'Manrope'" }}>{t.addAnother}</button>
                </div>
              </div>
            )}
          </section>
          )}
        </main>
      </div>

      <footer style={{ background:'#fff', borderTop:'1px solid '+P.line }}>
        <div style={{ padding:'16px clamp(14px,2.6vw,30px)', display:'flex', gap:14, flexWrap:'wrap', justifyContent:'space-between', font:"500 11.5px/1.5 'Manrope'", color:'#8794A6' }}>
          <span>sparAds SA · Cotonou, Bénin · RCCM BJ-COT-01-2026</span>
          <span style={{ display:'flex', gap:16, flexWrap:'wrap' }}><a href="#" style={{ color:'#8794A6' }}>{t.terms}</a><a href="#" style={{ color:'#8794A6' }}>{t.support}</a><a href="#" style={{ color:'#8794A6' }}>{t.rateCard}</a></span>
        </div>
      </footer>

      {/* TOP-UP MODAL */}
      {modal==='topup' && (
        <div onClick={()=>setModal(null)} style={{ position:'fixed', inset:0, zIndex:60, background:'rgba(15,24,38,.45)', display:'flex', alignItems:'center', justifyContent:'center', padding:18 }}>
          <div onClick={ev=>ev.stopPropagation()} style={{ width:'100%', maxWidth:420, background:'#fff', borderRadius:15, padding:'clamp(20px,3vw,28px)', animation:'riseIn .2s ease' }}>
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:12 }}>
              <div>
                <div style={{ font:"800 17px/1.25 'Manrope'", letterSpacing:'-.02em' }}>{t.topUpTitle}</div>
                <div style={{ marginTop:7, font:"500 12.5px/1.5 'Manrope'", color:P.mute }}>{t.topUpBody}</div>
              </div>
              <button className="btn" onClick={()=>setModal(null)} style={{ border:'none', background:P.bg, borderRadius:8, width:30, height:30, display:'flex', alignItems:'center', justifyContent:'center', flex:'none' }}><Icon name="close" size={15} color={P.body} sw={2}/></button>
            </div>
            <div style={{ marginTop:18, display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,86px),1fr))', gap:8 }}>
              {[5000,10000,20000,50000].map(v=>{
                const on = topup===v;
                return <button key={v} className="btn" onClick={()=>setTopup(v)} style={{ padding:'13px 8px', borderRadius:9, border:'1px solid '+(on?P.blue:P.line), background:on?P.blueSoft:'#fff', color:on?P.blueDark:P.ink, font:"800 12.5px/1 'Manrope'" }}>{fmt(v)}</button>;
              })}
            </div>
            <div style={{ marginTop:16, padding:14, borderRadius:10, background:P.bg, display:'flex', justifyContent:'space-between', gap:12 }}>
              <span style={{ font:"600 12.5px/1 'Manrope'", color:P.mute }}>{t.amount}</span>
              <span style={{ font:"800 15px/1 'Manrope'" }}>{money(topup)}</span>
            </div>
            <div style={{ display:'flex', gap:9, marginTop:18, flexWrap:'wrap' }}>
              <button className="btn" onClick={()=>{ setBalance(b=>b+topup); setTx(prev=>[{ en:'Wallet top-up · '+NETS[0].n, fr:'Recharge · '+NETS[0].n, d:'Today', v:topup, k:'in' }, ...prev]); setModal(null); flash(t.toastTopUp); }} style={{ flex:'1 1 180px', padding:15, border:'none', borderRadius:9, background:P.blue, color:P.ink, font:"800 13px/1 'Manrope'" }}>{t.confirmTopUp}</button>
              <button className="btn" onClick={()=>setModal(null)} style={{ flex:'0 1 110px', padding:15, borderRadius:9, border:'1px solid '+P.line, background:'#fff', font:"700 12.5px/1 'Manrope'", color:P.body }}>{t.cancel}</button>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      <div style={{ position:'fixed', left:16, bottom:18, right:16, zIndex:70, display:'flex', justifyContent:'center', pointerEvents:'none', opacity:toast?1:0, transform:toast?'translateY(0)':'translateY(10px)', transition:'all .22s ease' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, maxWidth:420, padding:'13px 16px', borderRadius:11, background:P.ink, color:'#fff', font:"600 12.5px/1.4 'Manrope'", boxShadow:'0 12px 30px rgba(15,24,38,.28)' }}>
          <Icon name="check" size={15} color="#7BE3AE" sw={2.4}/><span>{toast||''}</span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
